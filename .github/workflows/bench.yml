name: Benchmarks

# Regenerates results.md whenever the code or its dependencies change on main (including merged Dependabot PRs),
# and on demand from the Actions tab.
#
# GitHub-hosted runners are shared VMs, so absolute numbers drift from run to run; compare implementations within
# one results.md rather than across commits. Each benchmark runs six times; internal/benchreport reports the median
# and ranks implementations by their time relative to the fastest, per benchmark and averaged across benchmarks.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "schema.sql"
      - "query.sql"
      - ".github/workflows/bench.yml"
      - ".github/actions/setup-postgres/**"

permissions:
  contents: write

concurrency:
  group: bench
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-postgres

      - name: Run benchmarks
        shell: bash # -o pipefail, so a failing benchmark isn't masked by tee
        run: go test -run '^$' -bench . -benchmem -count 6 -timeout 0 ./ | tee bench.txt

      - name: Write results.md
        run: |
          go run ./internal/benchreport -commit "$GITHUB_SHA" -pg "$(psql -d postgres -tAc 'SHOW server_version;')" bench.txt > results.md
          cat results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add results.md
          if git diff --cached --quiet; then
            echo "results.md unchanged"
            exit 0
          fi
          # [skip ci]: the results commit doesn't need tests, and doesn't touch any path that retriggers this workflow.
          git commit -m "Update benchmark results [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

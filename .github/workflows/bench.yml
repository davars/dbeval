name: Benchmarks

# Regenerates results.txt whenever the code or its dependencies change on main (including merged Dependabot PRs),
# and on demand from the Actions tab.
#
# GitHub-hosted runners are shared VMs, so absolute numbers drift from run to run; compare implementations within
# one results.txt rather than across commits. Each benchmark runs six times (the minimum for benchstat to report a
# confidence interval) and benchstat reports the median with its variation.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "schema.sql"
      - "query.sql"
      - ".github/workflows/bench.yml"
      - ".github/actions/setup-postgres/**"

permissions:
  contents: write

concurrency:
  group: bench
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-postgres

      - name: Run benchmarks
        shell: bash # -o pipefail, so a failing benchmark isn't masked by tee
        run: go test -run '^$' -bench . -benchmem -count 6 -timeout 0 ./ | tee bench.txt

      - name: Summarize with benchstat
        run: |
          # Implementations run in random order; sort so rows group by implementation, and keep only the result
          # lines so stray log output can't break benchstat's parsing.
          {
            grep -E '^(goos|goarch|pkg|cpu):' bench.txt | sort -u
            grep -E '^Benchmark.*ns/op' bench.txt | sort -s -k1,1
          } > sorted.txt
          {
            echo "Generated by .github/workflows/bench.yml; raw output is in the workflow run log."
            echo "commit: $GITHUB_SHA"
            echo "date:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "pg:     $(psql -d postgres -tAc 'SHOW server_version;')"
            echo "go:     $(go env GOVERSION)"
            echo
            go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e results=sorted.txt
          } > results.txt
          cat results.txt

      - name: Commit results.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add results.txt
          if git diff --cached --quiet; then
            echo "results.txt unchanged"
            exit 0
          fi
          # [skip ci]: the results commit doesn't need tests, and doesn't touch any path that retriggers this workflow.
          git commit -m "Update benchmark results [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-postgres

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        # A non-UTC zone, so time zone handling bugs that UTC would hide (wrong instants stored or read) show up.
        env:
          TZ: America/Los_Angeles
        run: go test -v ./...
